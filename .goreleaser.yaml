# Official distribution: multi-OS binaries, checksums, SBOM, release notes.
# Version from Git tag (e.g. v1.0.0). Run: goreleaser release
# Snapshot (no tag): goreleaser release --snapshot

version: 2

project_name: vaultpack

builds:
  - id: vaultpack
    main: ./cmd/vaultpack
    binary: vaultpack
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Skpow1234/Vaultpack/internal/cli.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"
    ids:
      - vaultpack

checksum:
  name_template: "checksums-sha256.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: Skpow1234
    name: Vaultpack
  name_template: "{{.Tag}}"
  draft: false

# SBOM for each archive (requires syft in PATH when releasing)
sboms:
  - id: default
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
    disable: false

# Sign release artifacts with cosign (keyless via Sigstore / Fulcio).
# Requires cosign in PATH and an OIDC token in the environment
# (provided automatically by GitHub Actions when `id-token: write` is set on the job).
# Verify with:
#   cosign verify-blob \
#     --certificate <name>.pem \
#     --signature <name>.sig \
#     --certificate-identity-regexp 'https://github.com/Skpow1234/Vaultpack' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     <name>
signs:
  - id: cosign
    cmd: cosign
    artifacts: all
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"

# Homebrew tap (macOS / Linux). Requires a separate `Skpow1234/homebrew-tap`
# repository and a personal access token exposed as $HOMEBREW_TAP_GITHUB_TOKEN.
# When the token is missing the cask step is skipped automatically by GoReleaser.
# (Migrated from the deprecated `brews` formula section to `homebrew_casks`.)
homebrew_casks:
  - name: vaultpack
    binaries:
      - vaultpack
    repository:
      owner: Skpow1234
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/Skpow1234/Vaultpack
    description: "Encrypt, hash, and sign data into portable .vpack bundles."
    commit_author:
      name: vaultpack-release-bot
      email: actions@github.com
    # Skip the tap push when no tap token is configured (env is always set by
    # the workflow, possibly to an empty string). Otherwise honor `auto`, which
    # also skips prerelease tags (e.g. v1.0.0-rc1).
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}true{{ else }}auto{{ end }}'
    # The release binaries are not Apple-notarized, so strip the quarantine
    # attribute on install to avoid the "damaged and cannot be opened" error.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vaultpack"]
          end

# Scoop bucket (Windows). Requires a separate `Skpow1234/scoop-bucket` repository
# and $SCOOP_BUCKET_GITHUB_TOKEN (PAT with contents:write on the bucket).
scoops:
  - name: vaultpack
    description: "Encrypt, hash, and sign data into portable .vpack bundles."
    homepage: https://github.com/Skpow1234/Vaultpack
    license: MIT
    repository:
      owner: Skpow1234
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    commit_author:
      name: vaultpack-release-bot
      email: actions@github.com
    skip_upload: '{{ if eq .Env.SCOOP_BUCKET_GITHUB_TOKEN "" }}true{{ else }}auto{{ end }}'

# Winget (Windows). Fork microsoft/winget-pkgs, then set $WINGET_PUBLISH_TOKEN
# (PAT with repo scope). GoReleaser opens a PR to the community catalog.
winget:
  - name: vaultpack
    publisher: Skpow1234
    package_identifier: Skpow1234.Vaultpack
    short_description: "Encrypt, hash, and sign data into portable .vpack bundles."
    license: MIT
    homepage: https://github.com/Skpow1234/Vaultpack
    license_url: https://github.com/Skpow1234/Vaultpack/blob/main/LICENSE
    publisher_url: https://github.com/Skpow1234
    publisher_support_url: https://github.com/Skpow1234/Vaultpack/issues
    copyright: Skpow1234
    release_notes_url: "https://github.com/Skpow1234/Vaultpack/releases/tag/v{{ .Version }}"
    tags:
      - encryption
      - signing
      - cli
      - security
    repository:
      owner: Skpow1234
      name: winget-pkgs
      branch: "vaultpack-{{ .Version }}"
      token: "{{ .Env.WINGET_PUBLISH_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    commit_author:
      name: vaultpack-release-bot
      email: actions@github.com
    skip_upload: '{{ if eq .Env.WINGET_PUBLISH_TOKEN "" }}true{{ else }}auto{{ end }}'

# Chocolatey package (Windows). Requires CHOCOLATEY_API_KEY in the environment.
# Built on a Windows runner (choco is not available on Linux). When the API key is
# empty the .nupkg is generated but not pushed to chocolatey.org.
chocolateys:
  - name: vaultpack
    title: VaultPack
    authors: Skpow1234
    project_url: https://github.com/Skpow1234/Vaultpack
    license_url: https://github.com/Skpow1234/Vaultpack/blob/main/LICENSE
    project_source_url: https://github.com/Skpow1234/Vaultpack
    docs_url: https://github.com/Skpow1234/Vaultpack#readme
    bug_tracker_url: https://github.com/Skpow1234/Vaultpack/issues
    copyright: "Skpow1234"
    summary: "Encrypt, hash, and sign data into portable .vpack bundles."
    description: |
      VaultPack encrypts, hashes, and signs data artifacts into portable .vpack bundles.
      Supports AES-GCM, ChaCha20-Poly1305, AES-GCM-SIV, hybrid recipient encryption,
      multi-recipient bundles, Ed25519/Ed448/ECDSA/RSA-PSS/ML-DSA/SLH-DSA signing,
      KMS-wrapped DEKs (AWS/GCP/Azure), and Sigstore-signed releases.
    release_notes: "https://github.com/Skpow1234/Vaultpack/releases/tag/v{{ .Version }}"
    tags: "encryption signing aead post-quantum kms cli"
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"
    source_repo: "https://push.chocolatey.org/"
    skip_publish: '{{ if eq .Env.CHOCOLATEY_API_KEY "" }}true{{ else }}false{{ end }}'

# Linux packages (apt/deb, rpm, apk). nfpms generates the artifacts directly;
# publishing to a hosted apt/yum repo (e.g. Cloudsmith) is configured below
# under `publishers` and is gated on $CLOUDSMITH_API_KEY.
nfpms:
  - id: linux-packages
    package_name: vaultpack
    vendor: Skpow1234
    homepage: https://github.com/Skpow1234/Vaultpack
    maintainer: Skpow1234 <noreply@github.com>
    description: |
      Encrypt, hash, and sign data into portable .vpack bundles.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils
    priority: optional
    file_name_template: "{{ .ConventionalFileName }}"

# Optional: publish .deb/.rpm/.apk packages to a Cloudsmith-hosted repo.
# Disabled when $CLOUDSMITH_API_KEY is empty.
publishers:
  - name: cloudsmith
    ids:
      - linux-packages
    cmd: >-
      sh -c '[ -z "$CLOUDSMITH_API_KEY" ] && echo "skipping cloudsmith publish (no API key)" && exit 0;
      curl --user "$CLOUDSMITH_API_KEY:" --upload-file {{ .ArtifactPath }}
      https://upload.cloudsmith.io/skpow1234/vaultpack/{{ .ArtifactName }}'
