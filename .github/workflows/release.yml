name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Run goreleaser in --snapshot mode (no publish)"
        required: false
        default: "false"

permissions:
  contents: write
  packages: write
  # Required by cosign / Sigstore for keyless signing.
  id-token: write

# Force the installed Go to be used (no toolchain auto-download) so the released
# binaries are built with the patched stdlib.
env:
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    name: GoReleaser (cosign-signed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify cosign
        run: cosign version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release
            --clean
            ${{ github.event.inputs.snapshot == 'true' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # COSIGN_EXPERIMENTAL=1 enables keyless signing path on older cosign
          # versions; it is the default since cosign v2.0.0 but kept here for safety.
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload release artifacts (snapshot)
        if: github.event.inputs.snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sig
            dist/*.pem
            dist/*.sbom.json
            dist/checksums-sha256.txt
